<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc"><title id="title">Camadas da Terra</title><desc id="desc">Corte ilustrado do planeta com crosta, manto e núcleo.</desc><defs><linearGradient id="space" x1="0" x2="1"><stop stop-color="#132a3c"/><stop offset="1" stop-color="#244b59"/></linearGradient><radialGradient id="earth"><stop stop-color="#f7d27d"/><stop offset=".45" stop-color="#ec795e"/><stop offset=".78" stop-color="#e6b64f"/><stop offset="1" stop-color="#6f8f78"/></radialGradient></defs><rect width="1200" height="470" fill="url(#space)"/><g opacity=".35" fill="#f7d27b"><circle cx="100" cy="70" r="2"/><circle cx="180" cy="320" r="2"/><circle cx="1030" cy="88" r="2"/><circle cx="1110" cy="300" r="3"/></g><circle cx="370" cy="245" r="168" fill="url(#earth)"/><path d="M370 77a168 168 0 0 0 0 336l0-336z" fill="#6f8f78" opacity=".88"/><path d="M370 114a131 131 0 0 0 0 262l0-262z" fill="#e6b64f" opacity=".95"/><path d="M370 163a82 82 0 0 0 0 164l0-164z" fill="#ec795e" opacity=".98"/><path d="M370 198a47 47 0 0 0 0 94l0-94z" fill="#f7d27d"/><path d="M370 76a168 168 0 0 0 0 338" fill="none" stroke="#fffdf8" stroke-width="4"/><g fill="#fffdf8" font-family="Arial" font-size="23" font-weight="700"><text x="650" y="145">CROSTA</text><text x="650" y="230">MANTO</text><text x="650" y="315">NÚCLEO</text></g><g stroke="#f7d27b" stroke-width="2" fill="none"><path d="M572 137h-120"/><path d="M572 222h-140"/><path d="M572 307h-160"/></g><g fill="#f7d27b" font-family="Arial" font-size="14"><text x="650" y="172">camada externa, onde vivemos</text><text x="650" y="257">camada espessa e muito quente</text><text x="650" y="342">região central do planeta</text></g><text x="77" y="430" fill="#dce9e7" font-family="monospace" font-size="15" letter-spacing="2">MAPA DO INTERIOR DA TERRA</text></svg>
